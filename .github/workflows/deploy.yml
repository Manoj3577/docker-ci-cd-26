name: Docker CI/CD Pipeline

on:
  workflow_dispatch:
  # optional: also run automatically on pushes to main
  # push:
  #   branches:
  #     - main

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/docker-cicd-demo

jobs:
  # Stage 1: Validate the Dockerfile
  lint:
    name: 1 - Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v6

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  # Stage 2: Test that the image builds (no push)
  build:
    name: 2 - Build Image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Stage 3: Push the image to Docker Hub
  push:
    name: 3 - Push to Docker Hub
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Stage 4: Deploy on EC2
  deploy:
    name: 4 - Deploy to EC2
    runs-on: ubuntu-latest
    needs: push
    steps:
      - name: Deploy Application on EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_NAME
          script: |
            sudo docker pull "$IMAGE_NAME:latest"
            sudo docker rm -f docker-cicd-demo || true
            sudo docker run -d \
              --name docker-cicd-demo \
              --restart unless-stopped \
              -p 80:80 \
              "$IMAGE_NAME:latest"
            sudo docker ps
